[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapa-poder-worker"
version = "0.1.0"
description = "Ingestión verificable de fuentes oficiales mexicanas"
requires-python = ">=3.9"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "httpx>=0.28,<1",
  "python-dotenv>=1.1,<2",
  "psycopg[binary]>=3.2,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "respx>=0.22,<1", "ruff>=0.12,<1"]

[project.scripts]
mapa-ingest = "worker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
